plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = "kontur" }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        techmod {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }

// Native server integration tests; not included in the distributed mod JAR.
sourceSets { gametest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
configurations { gametestImplementation.extendsFrom implementation; gametestRuntimeOnly.extendsFrom runtimeOnly }
loom {
    mods { techmod_tests { sourceSet sourceSets.gametest } }
    runs {
        gameTest {
            server()
            name 'Kontur integration tests'
            source sourceSets.gametest
            runDir 'build/gametest-run'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=../gametest-results.xml'
            vmArg '-Dfabric-api.gametest.filter=techmod_tests:*'
        }
    }
}
sourceSets { clientTest { compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath } }
configurations { clientTestImplementation.extendsFrom implementation; clientTestRuntimeOnly.extendsFrom runtimeOnly }
loom {
 mods { techmod_visual_tests { sourceSet sourceSets.clientTest } }
 runs {
  visualTest {
   client()
   source sourceSets.clientTest
   runDir 'build/visual-test-run'
   vmArg '-Dfabric.client.gametest'
   vmArg '-Dfabric.client.gametest.modid=techmod_visual_tests'
  }
 }
}
